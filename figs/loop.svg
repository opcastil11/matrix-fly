<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="500" viewBox="0 0 760 250" role="img" aria-label="the loop">
<style>.dg-box{fill:#f4f5f1;stroke:#17201b;stroke-width:1.2}.dg-soft{fill:#e9ece6;stroke:#d3d9d2}.dg-t{font:11px IBM Plex Mono,DejaVu Sans Mono,monospace;fill:#17201b}.dg-m{font:10px IBM Plex Mono,DejaVu Sans Mono,monospace;fill:#5d6862}.dg-l{stroke:#17201b;stroke-width:1.2;fill:none}.dg-a{stroke:#b1401f;stroke-width:1.6;fill:none}</style><rect width="760" height="250" fill="#f4f5f1"/><rect x="40" y="70" width="200" height="110" rx="6" class="dg-box"/>
